name: Publish game container

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-game-container
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Tags and history, for `git describe`.
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test
          docker compose config --quiet
      - name: Image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # A tagged release reads v1.2.0; later commits read v1.2.0-3-gabc1234.
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - name: Set up multi-platform emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build native image for smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          build-args: VERSION=${{ steps.image.outputs.version }}
          load: true
          tags: duty-shooter-smoke:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Exercise the actual container
        run: |
          # The public lobby (how the home server runs it) and the passphrase mode.
          docker run -d --name game-smoke --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            -p 127.0.0.1:3090:3000 duty-shooter-smoke:local
          docker run -d --name game-smoke-passphrase --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            -e PASSPHRASE=smoke-test -p 127.0.0.1:3091:3000 duty-shooter-smoke:local
          for name in game-smoke game-smoke-passphrase; do
            for i in $(seq 1 30); do
              [ "$(docker inspect --format '{{.State.Health.Status}}' "$name")" = healthy ] && break
              sleep 1
            done
          done
          node apps/server/scripts/smoke.mjs http://127.0.0.1:3090
          node apps/server/scripts/smoke.mjs http://127.0.0.1:3091 smoke-test --lockout
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish latest and commit-tagged images
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          build-args: VERSION=${{ steps.image.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container logs
        if: always()
        run: |
          docker logs game-smoke 2>/dev/null || true
          docker logs game-smoke-passphrase 2>/dev/null || true
