<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Duty Shooter</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #111418;
        color: #e6e8eb;
        font: 13px/1.4 system-ui, sans-serif;
      }
      /* The main menu's aerial as a still, behind the canvas until the live world's first frame covers it (main.ts drops it then). */
      body {
        background-image: url(/menu/survival-town.jpg);
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
      }
      #view {
        display: block;
        width: 100vw;
        height: 100vh;
        /* A finger on the view is the game's: never a scroll, a pinch or a double-tap zoom. */
        touch-action: none;
      }
      #status {
        position: fixed;
        top: calc(8px + env(safe-area-inset-top, 0px));
        left: calc(8px + env(safe-area-inset-left, 0px));
        padding: 4px 8px;
        background: rgb(0 0 0 / 0.5);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="status">Starting renderer…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
