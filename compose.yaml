services:
  duty:
    image: ${DUTY_IMAGE:-ghcr.io/aleixribera/duty-shooter:latest}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${DUTY_PORT:-3090}:3000"
    environment:
      # Both come from the stack's .env (see .env.example); the repo never holds the real values.
      # No passphrase: one public lobby anyone with the link can join.
      PASSPHRASE: "${PASSPHRASE:-}"
      MAX_PLAYERS: "${MAX_PLAYERS:-8}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
