services:
  duty:
    image: ${DUTY_IMAGE:-ghcr.io/aleixribera/duty-shooter:latest}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${DUTY_PORT:-3090}:3000"
    environment:
      # All come from the stack's .env (see .env.example); the repo never holds the real values.
      # No passphrase: one public lobby anyone with the link can join.
      PASSPHRASE: "${PASSPHRASE:-}"
      MAX_PLAYERS: "${MAX_PLAYERS:-8}"
      MAP: "${MAP:-survival-town}"
      MODE: "${MODE:-tdm}"
      # Empty: each mode's own time limit.
      TIME_LIMIT: "${TIME_LIMIT:-}"
      # Bots a side the lobby fills to while anyone plays, and the most a first joiner may pick.
      BOTS_PER_TEAM: "${BOTS_PER_TEAM:-3}"
      MAX_BOTS_PER_TEAM: "${MAX_BOTS_PER_TEAM:-4}"
    # The event log (joins, leaves, matches) on the one writable path, kept across redeploys.
    volumes:
      - duty-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  duty-data:
